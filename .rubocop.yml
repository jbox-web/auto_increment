---
plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - bin/*
    - gemfiles/*
    - spec/dummy/**/*
    # Restated because this list replaces RuboCop's default Exclude instead of
    # merging with it: without it, `bundler-cache: true` in CI installs gems into
    # vendor/bundle and RuboCop walks into them, loading their own .rubocop.yml.
    - vendor/**/*

#########
# STYLE #
#########

Style/Documentation:
  Enabled: false

##########
# LAYOUT #
##########

Layout/LineLength:
  Max: 125

Layout/EmptyLines:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Layout/EmptyLinesAroundModuleBody:
  Enabled: false

#########
# RSPEC #
#########

# RSpec/InstanceVariable used to be disabled for the before(:all) fixtures in
# active_record_spec. Those rows escaped DatabaseCleaner's per-example transaction
# and survived the whole run, so they were moved to `let!` — and the cop is now
# enforced rather than silenced.
